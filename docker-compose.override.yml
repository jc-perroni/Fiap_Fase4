# docker-compose.override.yml
# Este arquivo é carregado automaticamente pelo Docker Compose
# Adiciona configurações de OpenTelemetry para ambiente local

version: "3.8"

services:
  auth-service:
    environment:
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: auth-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.name=auth-service,service.version=1.0.0,environment=local

  flag-service:
    environment:
      # OpenTelemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
