apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: feature-flags
spec:
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: 4566
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: feature-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.0
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "sqs,dynamodb"
            - name: DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              value: "local"
            - name: AWS_SECRET_ACCESS_KEY
              value: "local"
            - name: DEBUG
              value: "1"
            - name: LAMBDA_EXECUTOR
              value: "local"
          volumeMounts:
            - name: init-script
              mountPath: /etc/localstack/init/ready.d
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: init-script
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  namespace: feature-flags
data:
  init.sh: |
    #!/bin/bash

    echo "Waiting for LocalStack to be ready..."

    # Wait for LocalStack to be available
    until awslocal sqs list-queues --region us-east-1 &>/dev/null; do
      echo "LocalStack not ready yet, waiting..."
      sleep 2
    done

    echo "LocalStack is ready! Initializing resources..."

    # Create SQS queue
    awslocal sqs create-queue \
      --queue-name evaluation-events \
      --region us-east-1 || true

    # Get queue URL
    QUEUE_URL=$(awslocal sqs get-queue-url \
      --queue-name evaluation-events \
      --region us-east-1 \
      --query 'QueueUrl' \
      --output text)

    echo "SQS Queue URL: $QUEUE_URL"

    # Create DynamoDB table
    awslocal dynamodb create-table \
      --table-name evaluation_events \
      --attribute-definitions \
        AttributeName=id,AttributeType=S \
        AttributeName=timestamp,AttributeType=N \
      --key-schema \
        AttributeName=id,KeyType=HASH \
        AttributeName=timestamp,KeyType=RANGE \
      --billing-mode PAY_PER_REQUEST \
      --region us-east-1 || true

    echo "LocalStack initialization complete!"
