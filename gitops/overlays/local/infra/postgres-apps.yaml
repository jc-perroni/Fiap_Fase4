apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-apps-init
  namespace: feature-flags
data:
  init-flags.sql: |
    -- Flags database
    \c flags_db;

    CREATE TABLE IF NOT EXISTS feature_flags (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) UNIQUE NOT NULL,
        description TEXT,
        enabled BOOLEAN DEFAULT false,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Sample feature flags
    INSERT INTO feature_flags (name, description, enabled) VALUES
        ('new_ui', 'New user interface', true),
        ('beta_features', 'Beta features access', false),
        ('premium_tier', 'Premium tier features', true)
    ON CONFLICT (name) DO NOTHING;

  init-targeting.sql: |
    -- Targeting database
    \c targeting_db;

    CREATE TABLE IF NOT EXISTS targeting_rules (
        id SERIAL PRIMARY KEY,
        flag_id INTEGER NOT NULL,
        rule_type VARCHAR(50) NOT NULL,
        rule_value JSONB NOT NULL,
        priority INTEGER DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS user_segments (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) UNIQUE NOT NULL,
        description TEXT,
        criteria JSONB NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-apps
  namespace: feature-flags
spec:
  selector:
    app: postgres-apps
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-apps
  namespace: feature-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-apps
  template:
    metadata:
      labels:
        app: postgres-apps
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          command:
            - sh
            - -c
            - |
              docker-entrypoint.sh postgres &
              until pg_isready -U postgres; do sleep 1; done

              psql -U postgres -c "CREATE DATABASE flags_db;" || true
              psql -U postgres -c "CREATE USER flags_user WITH PASSWORD 'flags_password';" || true
              psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE flags_db TO flags_user;" || true

              psql -U postgres -c "CREATE DATABASE targeting_db;" || true
              psql -U postgres -c "CREATE USER targeting_user WITH PASSWORD 'targeting_password';" || true
              psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE targeting_db TO targeting_user;" || true

              psql -U flags_user -d flags_db < /docker-entrypoint-initdb.d/init-flags.sql || true
              psql -U targeting_user -d targeting_db < /docker-entrypoint-initdb.d/init-targeting.sql || true

              wait
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: postgres-apps-init
