apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healing-scripts
  namespace: observability
data:
  self-healing.sh: |
    #!/bin/bash
    # Self-Healing Script
    # This script is triggered by webhooks from AlertManager

    set -e

    SERVICE_NAME=$1
    ALERT_NAME=$2
    NAMESPACE=${3:-"feature-flag"}

    echo "$(date): Received alert: $ALERT_NAME for service: $SERVICE_NAME"

    case "$ALERT_NAME" in
      "AuthServiceHighErrorRate")
        echo "Restarting auth-service deployment due to high error rate..."
        kubectl rollout restart deployment/auth-service -n $NAMESPACE
        echo "Restart initiated for auth-service"
        
        # Send notification
        curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "{\"text\":\"🔄 Self-healing triggered: Restarted auth-service due to high 5xx error rate\"}"
        ;;
      
      "ServiceDown")
        echo "Service $SERVICE_NAME is down. Attempting restart..."
        kubectl rollout restart deployment/$SERVICE_NAME -n $NAMESPACE
        echo "Restart initiated for $SERVICE_NAME"
        
        curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "{\"text\":\"🔄 Self-healing triggered: Restarted $SERVICE_NAME (service was down)\"}"
        ;;
      
      "PodRestartLoop")
        echo "Pod restart loop detected for $SERVICE_NAME. Checking logs..."
        POD=$(kubectl get pods -n $NAMESPACE -l app=$SERVICE_NAME --sort-by=.status.startTime | tail -1 | awk '{print $1}')
        
        if [ ! -z "$POD" ]; then
          echo "Recent logs from $POD:"
          kubectl logs $POD -n $NAMESPACE --tail=50
          
          # Scale down and up to force fresh start
          echo "Scaling $SERVICE_NAME to 0 replicas..."
          kubectl scale deployment/$SERVICE_NAME -n $NAMESPACE --replicas=0
          sleep 10
          echo "Scaling $SERVICE_NAME back to 2 replicas..."
          kubectl scale deployment/$SERVICE_NAME -n $NAMESPACE --replicas=2
          
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔄 Self-healing triggered: Scaled $SERVICE_NAME to 0 and back to 2 due to restart loop\"}"
        fi
        ;;
      
      "HighMemoryUsage")
        echo "High memory usage detected for $SERVICE_NAME. Restarting to free memory..."
        kubectl rollout restart deployment/$SERVICE_NAME -n $NAMESPACE
        echo "Restart initiated for $SERVICE_NAME"
        
        curl -X POST "$SLACK_WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -d "{\"text\":\"⚠️ Self-healing triggered: Restarted $SERVICE_NAME due to high memory usage\"}"
        ;;
      
      *)
        echo "No self-healing action defined for alert: $ALERT_NAME"
        ;;
    esac

    echo "$(date): Self-healing action completed"

  webhook-server.py: |
    #!/usr/bin/env python3
    """
    Self-healing webhook server
    Receives alerts from AlertManager and triggers remediation actions
    """
    import os
    import json
    import subprocess
    import logging
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from base64 import b64decode

    logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
    log = logging.getLogger(__name__)

    WEBHOOK_USER = os.getenv("WEBHOOK_USER", "webhook")
    WEBHOOK_PASSWORD = os.getenv("WEBHOOK_PASSWORD", "changeme")

    class WebhookHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            # Check authentication
            auth_header = self.headers.get('Authorization', '')
            if not auth_header.startswith('Basic '):
                self.send_response(401)
                self.send_header('WWW-Authenticate', 'Basic realm="Self-Healing"')
                self.end_headers()
                return
            
            try:
                credentials = b64decode(auth_header[6:]).decode('utf-8')
                username, password = credentials.split(':', 1)
                if username != WEBHOOK_USER or password != WEBHOOK_PASSWORD:
                    raise ValueError("Invalid credentials")
            except Exception as e:
                log.error(f"Authentication failed: {e}")
                self.send_response(401)
                self.end_headers()
                return
            
            # Parse alert data
            content_length = int(self.headers['Content-Length'])
            post_data = self.rfile.read(content_length)
            
            try:
                alert_data = json.loads(post_data)
                log.info(f"Received alert: {json.dumps(alert_data, indent=2)}")
                
                # Process alerts
                for alert in alert_data.get('alerts', []):
                    alert_name = alert.get('labels', {}).get('alertname', 'Unknown')
                    service_name = alert.get('labels', {}).get('service', 'Unknown')
                    namespace = alert.get('labels', {}).get('namespace', 'feature-flag')
                    
                    if alert.get('status') == 'firing':
                        log.info(f"Triggering self-healing for {alert_name} on {service_name}")
                        
                        # Execute self-healing script
                        result = subprocess.run(
                            ['/scripts/self-healing.sh', service_name, alert_name, namespace],
                            capture_output=True,
                            text=True,
                            timeout=120
                        )
                        
                        log.info(f"Self-healing script output: {result.stdout}")
                        if result.stderr:
                            log.error(f"Self-healing script errors: {result.stderr}")
                
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ok"}).encode())
                
            except Exception as e:
                log.error(f"Error processing alert: {e}")
                self.send_response(500)
                self.end_headers()
        
        def log_message(self, format, *args):
            log.info(f"{self.client_address[0]} - {format % args}")

    if __name__ == '__main__':
        server = HTTPServer(('0.0.0.0', 8080), WebhookHandler)
        log.info("Self-healing webhook server started on port 8080")
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-webhook
  namespace: observability
  labels:
    app: self-healing-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing-webhook
  template:
    metadata:
      labels:
        app: self-healing-webhook
    spec:
      serviceAccountName: self-healing-sa
      containers:
        - name: webhook
          image: python:3.11-slim
          command: ["/scripts/webhook-server.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WEBHOOK_USER
              value: "webhook"
            - name: WEBHOOK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: self-healing-secret
                  key: webhook-password
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: self-healing-secret
                  key: slack-webhook-url
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: kubectl
              mountPath: /usr/local/bin/kubectl
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      initContainers:
        - name: install-kubectl
          image: bitnami/kubectl:latest
          command:
            ["sh", "-c", "cp /opt/bitnami/kubectl/bin/kubectl /kubectl/kubectl"]
          volumeMounts:
            - name: kubectl
              mountPath: /kubectl
      volumes:
        - name: scripts
          configMap:
            name: self-healing-scripts
            defaultMode: 0755
        - name: kubectl
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing-webhook
  namespace: observability
  labels:
    app: self-healing-webhook
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: self-healing-webhook
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-sa
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: self-healing-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: self-healing-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: self-healing-role
subjects:
  - kind: ServiceAccount
    name: self-healing-sa
    namespace: observability
---
apiVersion: v1
kind: Secret
metadata:
  name: self-healing-secret
  namespace: observability
type: Opaque
stringData:
  webhook-password: "267302b850bd7b573bd4140c5c61d194d4b3b57332f699c6c9a982ad98c47553"
  slack-webhook-url: "YOUR_SLACK_WEBHOOK_URL"
