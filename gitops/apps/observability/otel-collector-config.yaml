apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      # OTLP receiver for traces, metrics, and logs
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      
      # Prometheus receiver for scraping metrics
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']
      
      # Jaeger receiver for traces
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_binary:
            endpoint: 0.0.0.0:6832
      
      # Zipkin receiver for traces
      zipkin:
        endpoint: 0.0.0.0:9411
      
      # Kubernetes cluster receiver
      k8s_cluster:
        auth_type: serviceAccount
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure, NetworkUnavailable]
        allocatable_types_to_report: [cpu, memory, storage, ephemeral-storage]
      
      # Kubernetes events receiver
      k8s_events:
        auth_type: serviceAccount
        namespaces: [default, feature-flag, observability]

    processors:
      # Batch processor to batch telemetry data
      batch:
        timeout: 10s
        send_batch_size: 1024
      
      # Memory limiter to prevent OOM
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      
      # Resource processor to add resource attributes
      resource:
        attributes:
          - key: cluster.name
            value: feature-flag-cluster
            action: upsert
          - key: deployment.environment
            value: production
            action: upsert
      
      # Attributes processor for enrichment
      attributes:
        actions:
          - key: environment
            value: production
            action: insert
      
      # K8s attributes processor
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
          labels:
            - tag_name: app
              key: app
              from: pod
            - tag_name: version
              key: version
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

    exporters:
      # Prometheus exporter
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: otel
        const_labels:
          cluster: feature-flag-cluster
      
      # Prometheus Remote Write exporter
      prometheusremotewrite:
        endpoint: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write
        tls:
          insecure: true
      
      # Loki exporter for logs
      loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
      
      # New Relic OTLP exporter for traces, metrics, and logs
      otlp/newrelic:
        endpoint: otlp.nr-data.net:4317
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY}
        tls:
          insecure: false
      
      # OTLP exporter (for debugging)
      otlp:
        endpoint: otel-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
      
      # Logging exporter (for debugging)
      logging:
        loglevel: info
        sampling_initial: 5
        sampling_thereafter: 200

    extensions:
      # Health check extension
      health_check:
        endpoint: 0.0.0.0:13133
      
      # Pprof extension for profiling
      pprof:
        endpoint: 0.0.0.0:1777
      
      # ZPages extension for diagnostics
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, pprof, zpages]
      
      pipelines:
        # Traces pipeline
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/newrelic, logging]
        
        # Metrics pipeline
        metrics:
          receivers: [otlp, prometheus, k8s_cluster]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [prometheus, prometheusremotewrite, otlp/newrelic]
        
        # Logs pipeline
        logs:
          receivers: [otlp, k8s_events]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [loki, otlp/newrelic, logging]
      
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888
